name: Update Formula

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Download latest generated formula
        run: |
          mkdir -p Formula
          if ! curl -fsSL \
            https://github.com/swap3d/swap3d-cli/releases/latest/download/swap3d.rb \
            -o Formula/swap3d.rb; then
            echo "No public Swap3D CLI release formula is available yet."
            rm -f Formula/swap3d.rb
            exit 0
          fi
      - name: Validate formula
        if: hashFiles('Formula/swap3d.rb') != ''
        run: |
          brew tap-new swap3d/validation
          mkdir -p "$(brew --repository swap3d/validation)/Formula"
          cp Formula/swap3d.rb "$(brew --repository swap3d/validation)/Formula/swap3d.rb"
          brew style --formula swap3d/validation/swap3d
          brew audit --formula swap3d/validation/swap3d
      - name: Commit formula update
        if: hashFiles('Formula/swap3d.rb') != ''
        run: |
          if [ -z "$(git status --porcelain -- Formula/swap3d.rb)" ]; then
            echo "Formula is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/swap3d.rb
          git commit -m "chore: update Swap3D CLI formula"
          git push
